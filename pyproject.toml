[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "soloshine-ai-code-review"
version = "0.2.1"
description = "AI-powered code review tool with pre-commit hooks, custom LLM support, and context-aware analysis"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "SoloShine"},
]
keywords = ["code-review", "ai", "llm", "pre-commit", "git-hooks", "ollama", "openai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "typer>=0.9.0",
    "httpx>=0.25.0",
    "pyyaml>=6.0",
    "rich>=13.0.0",
]

[project.scripts]
ai-review = "ai_review.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-mock>=3.10",
]

[project.urls]
Homepage = "https://github.com/SoloShine/ai-code-review"
Documentation = "https://soloshine.github.io/ai-code-review/"
Repository = "https://github.com/SoloShine/ai-code-review"
Issues = "https://github.com/SoloShine/ai-code-review/issues"

[tool.setuptools.packages.find]
where = ["src"]
